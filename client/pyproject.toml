[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idlab-client"
version = "0.1.0"
description = "Python client for IOBEWI Device Lab"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = ["websockets>=15,<17"]

[tool.setuptools.packages.find]
where = ["src"]
