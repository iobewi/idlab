[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idlab-client"
version = "0.2.0"
description = "Python client for IOBEWI Device Lab"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = ["websockets>=15,<17"]

[project.scripts]
idlab = "idlab_client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
idlab_client = ["templates/hardware/*"]
