name: Python client

on:
  pull_request:
    paths:
      - 'clients/python/**'
      - 'core/**'
      - 'web/index.html'
      - '.github/workflows/python-client.yml'
  push:
    branches: [main]
    tags: ['python-client-v*']
    paths:
      - 'clients/python/**'
      - 'core/**'
      - 'web/index.html'
      - '.github/workflows/python-client.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and install the wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir dist clients/python
          python -m pip install -r core/requirements.txt dist/*.whl
          python -m pip check
      - name: Test the installed client against the server
        run: python -m unittest discover -s clients/python/tests -v
      - name: Upload the tested wheel
        uses: actions/upload-artifact@v4
        with:
          name: idlab-client-wheel
          path: dist/*.whl
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/python-client-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: idlab-client-wheel
          path: dist
      - name: Publish the tested wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#python-client-v}"
          wheel="dist/idlab_client-${version}-py3-none-any.whl"
          if [[ ! -f "$wheel" ]]; then
            echo "The tag version does not match the built wheel." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "$wheel" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --latest=false --title "IDLab Python client ${version}" \
            --notes "Install the attached wheel with Python 3.12 or newer."
