name: Python client

on:
  pull_request:
    paths:
      - 'clients/python/**'
      - 'core/**'
      - 'web/index.html'
      - '.github/workflows/python-client.yml'
  push:
    branches: [main]
    paths:
      - 'clients/python/**'
      - 'core/**'
      - 'web/index.html'
      - '.github/workflows/python-client.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and install the wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir dist clients/python
          python -m pip install -r core/requirements.txt dist/*.whl
          python -m pip install -r clients/python/src/idlab_client/templates/hardware/requirements.txt
          python -m pip check
      - name: Test the installed client against the server
        run: |
          idlab init --help
          python -m unittest discover -s clients/python/tests -v
      - name: Upload the tested wheel
        uses: actions/upload-artifact@v4
        with:
          name: idlab-client-wheel
          path: dist/*.whl
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: python-client-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v5
        with:
          name: idlab-client-wheel
          path: dist
      - name: Publish the tested wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("clients/python/pyproject.toml", "rb"))["project"]["version"])')"
          tag="python-client-v${version}"
          wheel="dist/idlab_client-${version}-py3-none-any.whl"
          if [[ ! -f "$wheel" ]]; then
            echo "The package version does not match the tested wheel." >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; bump the package version before publishing." >&2
            exit 1
          fi
          # Never attach a wheel to an existing tag pointing at another commit.
          existing="$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")"
          if [[ -n "$existing" ]]; then
            target="$(printf '%s\n' "$existing" | tail -n 1 | cut -f1)"
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "Tag $tag points to another commit." >&2
              exit 1
            fi
          fi
          gh release create "$tag" "$wheel" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --latest --title "IDLab Python client ${version}" \
            --notes "Install the attached wheel with Python 3.12 or newer."
