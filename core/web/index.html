<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IDLab — IOBEWI Device Lab</title>
  <link rel="stylesheet" href="/web/style.css">
</head>
<body>
<div class="application">
  <header class="app-header">
    <div class="app-brand">
      <h1>IDLab</h1>
      <p class="app-brand-fullname">IOBEWI Device Lab</p>
      <p>Contrôle et qualification de systèmes embarqués</p>
    </div>
  </header>
  <div class="workspace">
    <aside class="device-panel" aria-label="Connexion et cartes">
      <form id="connect" class="card-group">
        <h2>Ajouter une carte</h2>
        <label>Nom <input name="device" required pattern="[A-Za-z0-9][A-Za-z0-9_\-]{0,47}"></label>
        <label>Mode
          <select name="mode">
            <option value="console">Console série</option>
            <option value="stub">Flash — stub standard</option>
            <option value="rom">Identification — ROM seule</option>
          </select>
        </label>
        <label id="console-baud">Débit UART
          <input name="baud" type="number" min="1200" max="3000000" step="1" value="115200" required>
        </label>
        <label id="flash-entry" hidden><input type="checkbox" name="manual"> BOOT manuel</label>
        <button class="primary">Connecter</button>
        <output id="status" role="status"></output>
      </form>
      <section class="card-group" aria-labelledby="card-list-title">
        <h2 id="card-list-title">Cartes actives</h2>
        <p id="empty-cards">Aucune carte connectée.</p>
        <div id="card-list"></div>
      </section>
    </aside>
    <main class="work-area">
      <div class="tabs" aria-label="Sections IDLab">
        <a href="#boards">Cartes et console</a>
        <a href="#campaigns">Campagnes</a>
      </div>
      <section id="boards" aria-label="Cartes et console"></section>
<section id="campaigns" aria-labelledby="campaigns-title">
  <h2 id="campaigns-title">Campagnes</h2>
  <section id="campaign-live" aria-labelledby="campaign-live-title">
    <h3 id="campaign-live-title">En cours</h3>
    <p id="campaign-counts"></p>
  </section>
  <section id="campaign-history" aria-labelledby="campaign-history-title">
    <h3 id="campaign-history-title">Historique</h3>
    <form id="campaign-search">
      <label>Nom ou identifiant <input name="q" type="search" maxlength="120"></label>
      <label>État
        <select name="state">
          <option value="">Tous</option>
          <option value="active">Active</option>
          <option value="abort_requested">Avortement demandé</option>
          <option value="aborted">Avortée</option>
          <option value="finished">Terminée</option>
        </select>
      </label>
      <label>Verdict <input name="verdict" type="text" maxlength="80"></label>
      <label>Du (UTC) <input name="from" type="date"></label>
      <label>Au (UTC) <input name="to" type="date"></label>
      <button>Rechercher</button>
    </form>
  </section>
</section>
    </main>
  </div>
</div>
<template id="campaign-list">
  <output role="status"></output>
  <div class="campaign-table" hidden>
    <table>
      <thead><tr>
        <th scope="col">Campagne</th><th scope="col">État</th><th scope="col">Début</th>
        <th scope="col">Durée</th><th scope="col">Lectures en cours</th><th scope="col">Verdict</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="campaign-pages" hidden>
    <button type="button" data-page="previous">Précédent</button>
    <button type="button" data-page="next">Suivant</button>
  </div>
</template>
<template id="board">
  <article>
    <h2></h2>
    <p></p>
    <button type="button" data-disconnect>Déconnecter</button>
    <form>
      <label>Adresse <input name="address" type="text" required value="0x0"></label>
      <label>Taille en octets <input name="size" type="text" required value="4096"></label>
      <button>Lire la flash</button>
    </form>
    <output role="status"></output>
  </article>
</template>
<template id="serial-console">
  <article class="console-pane">
    <header class="pane-title">
      <h2></h2>
      <span data-baud></span>
      <button type="button" data-disconnect>Déconnecter</button>
    </header>
    <form class="toolbar">
      <label>Commande <input name="line" type="text" autocomplete="off"></label>
      <label>Fin de ligne
        <select name="ending">
          <option value="lf">LF</option>
          <option value="crlf">CRLF</option>
          <option value="cr">CR</option>
          <option value="none">Aucune</option>
        </select>
      </label>
      <button class="primary">Envoyer</button>
      <button type="button" data-clear>Effacer</button>
      <label><input type="checkbox" name="follow" checked> Suivre</label>
    </form>
    <pre class="console" tabindex="0" aria-label="Sortie série"></pre>
    <output role="status"></output>
  </article>
</template>
<script type="module" src="/web/app.js"></script>
<script type="module" src="/web/campaign-view.js"></script>

</body>
